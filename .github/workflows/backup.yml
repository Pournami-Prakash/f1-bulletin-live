name: Encrypted database backup
on:
  schedule:
    - cron: '43 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: f1-backup
  cancel-in-progress: false
jobs:
  backup:
    if: vars.ENABLE_ENCRYPTED_BACKUPS == '1' && vars.FREE_ACTIONS_STORAGE_CONFIRMED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install backup tools
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client-17 age
      - name: Dump and encrypt
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          BACKUP_RECIPIENT: ${{ vars.BACKUP_RECIPIENT }}
        run: |
          set -euo pipefail
          test -n "$NEON_DATABASE_URL"
          test -n "$BACKUP_RECIPIENT"
          umask 077
          trap 'rm -f /tmp/f1.dump' EXIT
          /usr/lib/postgresql/17/bin/pg_dump --dbname="$NEON_DATABASE_URL" --format=custom --no-owner --no-acl --lock-wait-timeout=10s --file=/tmp/f1.dump
          age -r "$BACKUP_RECIPIENT" -o /tmp/f1.dump.age /tmp/f1.dump
          cd /tmp
          sha256sum f1.dump.age > f1.dump.age.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-database-backup
          path: |
            /tmp/f1.dump.age
            /tmp/f1.dump.age.sha256
          if-no-files-found: error
          retention-days: 14
