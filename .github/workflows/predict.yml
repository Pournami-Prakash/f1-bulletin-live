name: F1 Race Predictions

on:
  schedule:
    # Check throughout race weekends for qualifying publication and race results.
    - cron: '17 */6 * * 0,1,5,6'
  workflow_dispatch:
    inputs:
      season:
        description: 'Season (empty uses current UTC year)'
        required: false
        type: string
      from_round:
        description: 'First round to reconcile'
        default: '1'
        type: string
      plan:
        description: 'Read-only status, no ingestion or database writes'
        default: false
        type: boolean
      refresh:
        description: 'Regenerate an existing pre-race forecast'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: f1-predictions
  cancel-in-progress: false

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/requirements-security.txt

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      FASTF1_RATE_LIMIT_WAIT_SECONDS: '30'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/fastf1
            etl/cache
          key: fastf1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: fastf1-${{ runner.os }}-
      - name: Install dependencies
        run: pip install --upgrade pip setuptools && pip install -r requirements.txt
      - name: Validate prediction safeguards
        run: python -m unittest discover -s etl/prediction -p 'test*.py'
      - name: Reconcile predictions and scores chronologically
        env:
          SEASON: ${{ inputs.season }}
          FROM_ROUND: ${{ inputs.from_round }}
          PLAN: ${{ inputs.plan }}
          REFRESH: ${{ inputs.refresh }}
        shell: bash
        run: |
          args=()
          if [[ -n "$SEASON" ]]; then args+=(--season "$SEASON"); fi
          if [[ -n "$FROM_ROUND" ]]; then args+=(--from-round "$FROM_ROUND"); fi
          if [[ "$PLAN" == 'true' ]]; then args+=(--plan); fi
          if [[ "$REFRESH" == 'true' ]]; then args+=(--refresh); fi
          python etl/prediction/weekly.py "${args[@]}"
      - name: Evaluate frozen prospective ranking policy
        if: inputs.plan != true
        run: python etl/prediction/prospective_gate.py --output artifacts/tyre-analysis/prospective-review.json
      - name: Upload tyre shadow diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tyre-shadow-${{ github.run_id }}
          path: artifacts/tyre-analysis/
          if-no-files-found: ignore
          retention-days: 90
