name: F1 Race Predictions

on:
  schedule:
    # Check throughout race weekends for qualifying publication and race results.
    - cron: '17 */6 * * 0,1,5,6'
  workflow_dispatch:
    inputs:
      season:
        description: 'Season (empty uses current UTC year)'
        required: false
        type: string
      from_round:
        description: 'First round to reconcile'
        default: '1'
        type: string
      plan:
        description: 'Read-only status, no ingestion or database writes'
        default: false
        type: boolean

concurrency:
  group: f1-predictions
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      FASTF1_RATE_LIMIT_WAIT_SECONDS: '30'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/fastf1
            etl/cache
          key: fastf1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: fastf1-${{ runner.os }}-
      - name: Install dependencies
        run: pip install fastf1 pandas numpy scikit-learn xgboost psycopg2-binary python-dotenv pyarrow
      - name: Reconcile predictions and scores chronologically
        env:
          SEASON: ${{ inputs.season }}
          FROM_ROUND: ${{ inputs.from_round }}
          PLAN: ${{ inputs.plan }}
        shell: bash
        run: |
          args=()
          if [[ -n "$SEASON" ]]; then args+=(--season "$SEASON"); fi
          if [[ -n "$FROM_ROUND" ]]; then args+=(--from-round "$FROM_ROUND"); fi
          if [[ "$PLAN" == 'true' ]]; then args+=(--plan); fi
          python etl/prediction/weekly.py "${args[@]}"
