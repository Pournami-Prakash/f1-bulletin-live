[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "signalrcore"
version = "1.0.2+f1.1"
description = "SignalR Core client: upstream 1.0.2 with a tested MessagePack security dependency update"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["msgpack>=1.2.3,<2"]

[tool.setuptools.packages.find]
include = ["signalrcore*"]
